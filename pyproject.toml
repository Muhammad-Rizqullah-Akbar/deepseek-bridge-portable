[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "deepseek-bridge-portable"
version = "2.5.0"
description = "Portable, Clean-Slate, Zero-Cost OpenAI-Compatible Gateway for DeepSeek V3/R1 & Hermes Native Integration"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Sovereign Xenonite Nucleus" }]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "playwright>=1.44.0",
    "wasmtime>=21.0.0",
    "httpx>=0.27.0",
    "curl-cffi>=0.7.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
]

[project.scripts]
deepseek-bridge = "deepseek_bridge.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["deepseek_bridge*"]
