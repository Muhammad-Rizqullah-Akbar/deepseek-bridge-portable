[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "deepseek-bridge-portable"
version = "2.5.0"
description = "Enterprise-Grade, Zero-Token-Cost OpenAI-Compatible Gateway for DeepSeek V3/R1 & Dynamic Hermes Native Integration"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Muhammad-Rizqullah-Akbar", email = "inirizqullahakbar@gmail.com" }]
maintainers = [{ name = "Muhammad-Rizqullah-Akbar", email = "inirizqullahakbar@gmail.com" }]
requires-python = ">=3.10"
keywords = ["deepseek", "hermes-agent", "llm-gateway", "openai-compatible", "agentic-ai", "reverse-engineering", "zero-token-cost"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Internet :: Proxy Servers",
]
dependencies = [
    "playwright>=1.44.0",
    "wasmtime>=21.0.0",
    "httpx>=0.27.0",
    "curl-cffi>=0.7.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
]

[project.urls]
Homepage = "https://github.com/Muhammad-Rizqullah-Akbar/deepseek-bridge-portable"
Documentation = "https://github.com/Muhammad-Rizqullah-Akbar/deepseek-bridge-portable#readme"
Repository = "https://github.com/Muhammad-Rizqullah-Akbar/deepseek-bridge-portable.git"
Issues = "https://github.com/Muhammad-Rizqullah-Akbar/deepseek-bridge-portable/issues"
Discussions = "https://github.com/Muhammad-Rizqullah-Akbar/deepseek-bridge-portable/discussions"

[project.scripts]
deepseek-bridge = "deepseek_bridge.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["deepseek_bridge*"]
